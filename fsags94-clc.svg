<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1760" viewBox="0 0 1360 1760"><rect width="1360" height="1760" fill="white"/><rect x="100" y="54" width="90" height="90" rx="8" fill="#0b5c50"/><circle cx="145" cy="97" r="27" fill="#f0d21c"/><text x="145" y="151" font-family="Times New Roman,Arial" font-size="20" font-weight="700"  text-anchor="middle" fill="#174b63">SAGS</text><text x="220" y="102" font-family="Times New Roman,Arial" font-size="17" font-weight="400"  text-anchor="start" fill="#111">SAIGON GROUND SERVICES</text><text x="680" y="92" font-family="Times New Roman,Arial" font-size="31" font-weight="700"  text-anchor="middle" fill="#111">Airlines CLC/Captain Produce</text><text x="680" y="126" font-family="Times New Roman,Arial" font-size="31" font-weight="700"  text-anchor="middle" fill="#111">Loadsheet Checklist</text><text x="1010" y="62" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Page: 1/1</text><text x="1010" y="88" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Revision No.: 03</text><text x="1010" y="114" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Issuing date: 04Mar21</text><text x="1010" y="140" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Effective date: 07Mar21</text><text x="1010" y="166" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Code: F/SAGS-CXR/94</text><line x1="100" y1="178" x2="1260" y2="178" stroke="#111" stroke-width="1.5"/><rect x="100" y="230" width="1160" height="82" fill="none" stroke="#111"/><line x1="350" y1="230" x2="350" y2="312" stroke="#111" stroke-width="1"/><line x1="520" y1="230" x2="520" y2="312" stroke="#111" stroke-width="1"/><line x1="690" y1="230" x2="690" y2="312" stroke="#111" stroke-width="1"/><line x1="900" y1="230" x2="900" y2="312" stroke="#111" stroke-width="1"/><text x="225" y="258" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">Flight No./Date</text><text x="435" y="258" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">Sector</text><text x="605" y="258" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">A/C Type</text><text x="795" y="258" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">A/C Registration</text><text x="1080" y="258" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">Checked by</text><rect x="100" y="280" width="1160" height="32" fill="none" stroke="#111"/><text x="112" y="303" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">A. PREPARATION</text><rect x="100" y="312" width="1160" height="38" fill="none" stroke="#111"/><line x1="690" y1="312" x2="690" y2="350" stroke="#111" stroke-width="1"/><text x="118" y="337" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Flight No., Pax booking, ETA/ETD, Parking bay</text><text x="708" y="337" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ GenDec/ Check list, LIR, Fuel Docket (if any)</text><rect x="100" y="350" width="1160" height="38" fill="none" stroke="#111"/><line x1="690" y1="350" x2="690" y2="388" stroke="#111" stroke-width="1"/><text x="118" y="375" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Cargo/Mail/EIC, Special Load/Dangerous Goods</text><text x="708" y="375" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Working Tools/Devices</text><rect x="100" y="388" width="1160" height="38" fill="none" stroke="#111"/><line x1="690" y1="388" x2="690" y2="426" stroke="#111" stroke-width="1"/><text x="118" y="413" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Aircraft defect, holds INOP</text><text x="708" y="413" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Estimate Bag/ULD and issue LIR (if any)</text><rect x="100" y="426" width="1160" height="38" fill="none" stroke="#111"/><line x1="690" y1="426" x2="690" y2="464" stroke="#111" stroke-width="1"/><text x="118" y="451" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Briefing with Co-ordinator/Load Master</text><text x="708" y="451" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Trial trim and balance of aircraft (if any)</text><rect x="100" y="464" width="1160" height="32" fill="none" stroke="#111"/><text x="112" y="487" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">B. FLIGHT MONITORING</text><rect x="100" y="496" width="1160" height="38" fill="none" stroke="#111"/><line x1="690" y1="496" x2="690" y2="534" stroke="#111" stroke-width="1"/><text x="118" y="521" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Monitor Passenger by zone (if any) and checked baggage</text><text x="708" y="521" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Check trim and balance of aircraft within prescribed limits (if any)</text><rect x="100" y="534" width="1160" height="32" fill="none" stroke="#111"/><text x="112" y="557" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">C. COMPLETION</text><rect x="100" y="566" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="591" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Confirm Closed Out Figures with Check-in Supervisor via walkie-talkie, OTT / check in system</text><rect x="100" y="604" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="629" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Confirm Closed Out Figures with Bag handling Supervisor via walkie-talkie, BMS</text><rect x="100" y="642" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="667" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Confirm Final LIR with Load Master/Co-ordinator via walkie-talkie / OTT</text><rect x="100" y="680" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="705" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Verify Dead Load/LIR and Fuel figures/Fuel density (if any) with Airlines CLC/Captain/Co-ordinator/Load Master</text><rect x="100" y="718" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="743" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Confirm Final Pax/bag figures with Co-ordinator via walkie-talkie / OTT / SAGS CLC</text><rect x="100" y="756" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="781" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Present/Transmit Final Load/LIR/Load/Trim Sheet to Captain/Co-ordinator</text><rect x="100" y="794" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="819" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Verify Pax, Dead Load on ACARS Loadsheet/Captain’s Loadsheet</text><rect x="100" y="832" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="857" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Hand over Flight Docs to Purser/Captain/Rep. and do LMC (if any)</text><rect x="100" y="870" width="1160" height="32" fill="none" stroke="#111"/><text x="112" y="893" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">D. POST FLIGHT</text><rect x="100" y="902" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="927" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Verify all special information on LIR and compose LDP messages (if any)</text><rect x="100" y="940" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="965" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Send Departure messages (if any) and input final figures of Dead Load into SMIS</text><rect x="100" y="978" width="1160" height="38" fill="none" stroke="#111"/><text x="118" y="1003" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Save files and upload data to FDS</text><rect x="100" y="1016" width="1160" height="250" fill="none" stroke="#111"/><text x="112" y="1040" font-family="Times New Roman,Arial" font-size="18" font-weight="700" font-style="italic" text-anchor="start" fill="#111">Remarks</text><line x1="180" y1="1301" x2="1180" y2="1301" stroke="#111" stroke-width="1"/><text x="680" y="1331" font-family="Times New Roman,Arial" font-size="16" font-weight="400" font-style="italic" text-anchor="middle" fill="#111">Verify that this is the correct version before use</text></svg>
