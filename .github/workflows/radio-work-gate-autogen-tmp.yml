name: Build verified radio work gate release
on:
  push:
    branches:
      - feat/require-radio-before-flight-report-20261107
permissions:
  contents: write
jobs:
  package-radio-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:runtime && npm run build:styles && node tools/release-manifest.cjs && npm run check:syntax
      - name: Commit generated runtime and hashed manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/modules/roster-open-guard.v1.js asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: verify mandatory radio gate and PWA asset hashes"
            git push origin HEAD:feat/require-radio-before-flight-report-20261107
          fi
