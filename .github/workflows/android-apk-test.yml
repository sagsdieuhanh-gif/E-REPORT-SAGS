name: Android APK (test)
on:
  push:
    branches:
      - feature/android-apk-twa
    paths:
      - 'android/**'
      - '.github/workflows/android-apk-test.yml'
      - 'assets/icons/icon-192.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout E-REPORT
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Use unchanged E-REPORT app icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/icons/icon-192.png android/app/src/main/res/drawable-nodpi/ic_ereport.png
      - name: Build signed debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" E-REPORT-SAGS-Android-TEST.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-REPORT-SAGS-Android-TEST
          path: E-REPORT-SAGS-Android-TEST.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-apk-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" E-REPORT-SAGS-Android-TEST.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "E-REPORT SAGS Android TEST #${GITHUB_RUN_NUMBER}" \
            --notes "Android APK thử nghiệm (TWA/Chrome); bản debug, không phải bản phát hành chính thức. Không thay đổi dữ liệu hoặc quy tắc nghiệp vụ. Cần Chrome và Internet cho lần mở đầu. Khi chưa đăng ký Digital Asset Links, sẽ hiển thị dưới dạng Custom Tab. APK không tự động làm nhanh tác vụ xuất PDF." \
            --prerelease
