name: Build checked iOS radio colour and overdue hotfix
on:
  push:
    branches:
      - fix/radio-overnight-gate-ios-color-v22-20261112
permissions:
  contents: write
jobs:
  package-radio-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit verified PWA asset hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: verified V2.2 iOS colour and overdue custody asset hashes"
            git push origin HEAD:fix/radio-overnight-gate-ios-color-v22-20261112
          fi
