name: Build V2.2 high colour radio release
on:
  push:
    branches:
      - feat/v22-radio-color-evidence-20261108
permissions:
  contents: write
jobs:
  package-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit verified PWA asset hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: verified V2.2 radio proof manifest hashes"
            git push origin HEAD:feat/v22-radio-color-evidence-20261108
          fi
