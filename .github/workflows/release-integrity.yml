name: Release integrity
on:
  pull_request:
  workflow_dispatch:
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Generated release must be committed
        run: git diff --exit-code
