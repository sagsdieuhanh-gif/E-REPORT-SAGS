name: Release integrity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: One-time commit generated assets on radio fix branch
        if: github.event.pull_request.head.ref == 'fix/radio-ios-evidence-admin-monitor-20261106'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): regenerate radio preview assets"
            git push origin HEAD:fix/radio-ios-evidence-admin-monitor-20261106
          fi
      - name: Generated release must be committed
        run: git diff --exit-code
