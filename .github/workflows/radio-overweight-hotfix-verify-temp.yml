name: Check V2.2 radio photo overweight hotfix
on:
  push:
    branches:
      - hotfix/radio-photo-too-heavy-autocompress-20261112
permissions:
  contents: write
jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit checked PWA hash manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: verify V2.2 auto-compress radio photo asset hashes"
            git push origin HEAD:hotfix/radio-photo-too-heavy-autocompress-20261112
          fi
