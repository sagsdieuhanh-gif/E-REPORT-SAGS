name: V2.2 Firebase radio proof emulator
on:
  push:
    branches:
      - feat/v22-radio-color-evidence-20261108
    paths:
      - firebase/firestore.rules
      - tests/radio-firestore-emulator.mjs
      - .github/workflows/radio-v22-emulator-tmp.yml
permissions:
  contents: read
jobs:
  secure-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false --ignore-scripts firebase-tools@14.25.0 firebase@11.10.0 @firebase/rules-unit-testing@4.0.1
      - name: Validate V2.2 production Firestore rules offline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: npx firebase emulators:exec --only firestore --project demo-e-report-radio-rules --config firebase.radio-test.json "node tests/radio-firestore-emulator.mjs"
