name: Build V2.2 high-fidelity radio image release
on:
  push:
    branches: [fix/radio-ios-photo-source-quality-v22-20261112]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit verified asset fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate verified V2.2 photo quality asset hashes"
            git push origin HEAD:fix/radio-ios-photo-source-quality-v22-20261112
          fi
