name: Radio custody daily and weekly email
on:
  schedule:
    # 07:05 Vietnam (UTC+7): report the entire previous day
    - cron: '5 0 * * *'
    # Monday 07:15 Vietnam: report previous Monday through Sunday
    - cron: '15 0 * * 1'
  workflow_dispatch:
    inputs:
      period:
        description: Report type
        type: choice
        options: [daily, weekly]
        default: daily
        required: true
      dry_run:
        description: Read Firebase but do not email
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: sags-radio-reporting
  cancel-in-progress: false
jobs:
  send:
    if: vars.SAGS_RADIO_REPORTS_ACTIVE == 'true' && github.repository == 'sagsdieuhanh-gif/E-REPORT-SAGS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: e-report-sags
      SAGS_SMTP_HOST: ${{ secrets.SAGS_SMTP_HOST }}
      SAGS_SMTP_PORT: ${{ vars.SAGS_SMTP_PORT }}
      SAGS_SMTP_USER: ${{ secrets.SAGS_SMTP_USER }}
      SAGS_SMTP_PASSWORD: ${{ secrets.SAGS_SMTP_PASSWORD }}
      SAGS_SMTP_FROM: ${{ vars.SAGS_SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Firebase and SMTP configuration
        env:
          PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          HAS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          set -euo pipefail
          if [ -z "$PROVIDER" ] && [ "$HAS_JSON" != 'true' ]; then
            echo "::error::NOT ACTIVE: Firebase Admin credentials missing"; exit 1
          fi
          if [ -z "$SAGS_SMTP_HOST" ] || [ -z "$SAGS_SMTP_USER" ] || [ -z "$SAGS_SMTP_PASSWORD" ] || [ -z "$SAGS_SMTP_FROM" ]; then
            echo "::error::NOT ACTIVE: SMTP credentials missing"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Firebase authentication via Workload Identity
        if: vars.FIREBASE_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: sags-retention@e-report-sags.iam.gserviceaccount.com
          project_id: e-report-sags
      - name: Firebase authentication via service account JSON
        if: vars.FIREBASE_WIF_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: e-report-sags
      - name: Install Firebase Admin SDK
        run: npm ci --ignore-scripts --prefix firebase/functions
      - name: Send daily report
        if: (github.event_name == 'schedule' && github.event.schedule == '5 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.period == 'daily')
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node firebase/functions/radio-report.cjs daily --dry-run
          else
            node firebase/functions/radio-report.cjs daily
          fi
      - name: Send weekly report
        if: (github.event_name == 'schedule' && github.event.schedule == '15 0 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.period == 'weekly')
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node firebase/functions/radio-report.cjs weekly --dry-run
          else
            node firebase/functions/radio-report.cjs weekly
          fi
