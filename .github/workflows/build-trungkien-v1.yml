name: Build TrungKien V1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android-trungkien-v1/**"
      - ".github/workflows/build-trungkien-v1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.TRUNGKIEN_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/trungkien-v1.jks"

      - name: Build signed release APK
        working-directory: android-trungkien-v1
        env:
          TRUNGKIEN_KEYSTORE_PATH: ${{ runner.temp }}/trungkien-v1.jks
          TRUNGKIEN_KEYSTORE_PASSWORD: ${{ secrets.TRUNGKIEN_KEYSTORE_PASSWORD }}
          TRUNGKIEN_KEY_ALIAS: ${{ secrets.TRUNGKIEN_KEY_ALIAS }}
          TRUNGKIEN_KEY_PASSWORD: ${{ secrets.TRUNGKIEN_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp android-trungkien-v1/app/build/outputs/apk/release/app-release.apk out/TrungKien-V1.apk
          sha256sum out/TrungKien-V1.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrungKien-V1-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
