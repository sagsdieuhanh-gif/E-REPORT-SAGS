name: Validate Malaysia Airlines MH AS-RM-F27 release
on:
  push:
    branches:
      - feat/mh-f27-checklist-20261114
permissions:
  contents: write
jobs:
  mh-form-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit verified PWA manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize MH F27 release asset fingerprints"
            git push origin HEAD:feat/mh-f27-checklist-20261114
          fi
