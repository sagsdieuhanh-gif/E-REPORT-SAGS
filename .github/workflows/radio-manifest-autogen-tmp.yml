name: Generate checked radio release manifest
on:
  push:
    branches:
      - feat/radio-roster-shift-single-holder-20261106
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit generated release manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync verified asset hashes for roster radio release"
            git push origin HEAD:feat/radio-roster-shift-single-holder-20261106
          fi
