name: Generate checked signature release hashes
on:
  push:
    branches:
      - feat/account-signature-reset-pdf-light-20261107
permissions:
  contents: write
jobs:
  package-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Commit verified PWA asset hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize verified signature-reset release hashes"
            git push origin HEAD:feat/account-signature-reset-pdf-light-20261107
          fi
