<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đang cập nhật E-REPORT</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#071a2e;color:#102a43;font-family:Arial,sans-serif;padding:18px;box-sizing:border-box}.card{width:min(92vw,520px);background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0006}h2{margin:0 0 10px;color:#075fb0}.status{margin:14px 0;padding:12px;border-radius:12px;background:#eef6ff;font-weight:800;white-space:pre-wrap}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#075fb0;color:#fff;font-weight:900;font-size:15px}small{display:block;margin-top:12px;color:#52606d;line-height:1.4}</style></head><body><main class="card"><h2>ĐANG CẬP NHẬT E-REPORT</h2><p>Hệ thống đang tự làm sạch bộ cập nhật cũ rồi nạp phiên bản mới. Dữ liệu chuyến bay và biểu mẫu trên máy không bị xóa.</p><div id="status" class="status">Đang chuẩn bị…</div><button id="retry" type="button" hidden>THỬ LẠI</button><small>Ứng dụng sẽ tự mở lại khi hoàn tất.</small></main><script>(async()=>{const s=document.getElementById('status'),btn=document.getElementById('retry'),q=new URLSearchParams(location.search),stage=q.get('stage')||'1',target=String(q.get('target')||'');const run=async()=>{btn.hidden=true;btn.disabled=true;try{let remote='';try{const r=await fetch('./version.json?repair='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();remote=String(j.build||j.version||'')}}catch(_){}const expected=remote||target;s.textContent=(expected?'Bản máy chủ: '+expected+'\n':'')+(stage==='1'?'Đang làm sạch bộ cập nhật cũ…':'Đang nạp phiên bản mới…');if(stage==='1'){if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();const here=new URL('./',location.href);await Promise.all(regs.filter(r=>{try{const u=new URL(r.scope);return u.origin===here.origin&&u.pathname===here.pathname}catch(_){return false}}).map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(n=>n.startsWith('sags-app-shell-')||n.startsWith('sags-app-meta-')).map(n=>caches.delete(n)))}const u=new URL('./repair.html',location.href);u.searchParams.set('stage','2');u.searchParams.set('auto','1');if(expected)u.searchParams.set('target',expected);u.searchParams.set('_',Date.now());location.replace(u.href);return}try{localStorage.removeItem('sags-v6-deferred-build');localStorage.removeItem('pdh-update-applying')}catch(_){}s.textContent='Đã làm sạch bộ cập nhật cũ. Đang mở phiên bản mới…';const u=new URL('./index.html',location.href);u.searchParams.set('_fresh',Date.now());if(expected)u.searchParams.set('_expected',expected);setTimeout(()=>location.replace(u.href),250)}catch(e){s.textContent='Chưa cập nhật được: '+String(e?.message||e);btn.hidden=false;btn.disabled=false}};btn.onclick=run;run()})();</script></body></html>
