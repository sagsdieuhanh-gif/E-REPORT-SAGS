<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Khôi phục cập nhật E-REPORT</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#071a2e;color:#102a43;font-family:Arial,sans-serif;padding:18px;box-sizing:border-box}
.card{width:min(92vw,520px);background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0006}
h2{margin:0 0 10px;color:#075fb0}p{line-height:1.45}.status{margin:14px 0;padding:12px;border-radius:12px;background:#eef6ff;font-weight:800;white-space:pre-wrap}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:#075fb0;color:#fff;font-weight:900;font-size:15px}
small{display:block;margin-top:12px;color:#52606d;line-height:1.4}
</style>
</head>
<body><main class="card">
<h2>KHÔI PHỤC CẬP NHẬT E-REPORT</h2>
<p>Trang này chỉ làm mới bộ nhớ đệm ứng dụng và Service Worker. Không xóa dữ liệu chuyến bay, biểu mẫu, localStorage hoặc IndexedDB.</p>
<div id="status" class="status">Đang chuẩn bị…</div>
<button id="retry" type="button">THỰC HIỆN LẠI</button>
<small>Nếu điện thoại đang giữ một shell cũ, quy trình sẽ đi qua 2 bước rồi tự mở lại ứng dụng.</small>
</main>
<script>
(async()=>{
 const s=document.getElementById('status'),btn=document.getElementById('retry');
 const qs=new URLSearchParams(location.search),stage=qs.get('stage')||'1';
 const run=async()=>{
  btn.disabled=true;
  try{
   let remote='';try{const r=await fetch('./version.json?repair='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();remote=String(j.displayVersion||j.version||'')}}catch(_){}
   s.textContent='Bản máy chủ: '+(remote||'đang kiểm tra')+'\nĐang làm mới bộ cập nhật…';
   if(stage==='1'){
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>new URL(r.scope).origin===location.origin && new URL(r.scope).pathname===new URL('./',location.href).pathname).map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.filter(n=>n.startsWith('sags-app-shell-')||n.startsWith('sags-app-meta-')).map(n=>caches.delete(n)));
    }
    const u=new URL('./repair.html',location.href);u.searchParams.set('stage','2');u.searchParams.set('_',Date.now());
    location.replace(u.href);return;
   }
   s.textContent='Đã gỡ shell/cache cũ. Đang mở lại bản mới…';
   try{localStorage.removeItem('pdh-update-applying');localStorage.removeItem('sags-v6-deferred-build')}catch(_){}
   setTimeout(()=>location.replace('./index.html?_fresh='+Date.now()),350);
  }catch(e){s.textContent='Chưa khôi phục được: '+String(e?.message||e);btn.disabled=false}
 };
 btn.onclick=run;run();
})();
</script></body></html>
