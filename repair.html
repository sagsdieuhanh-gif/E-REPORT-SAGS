<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đang cập nhật E-REPORT</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#071a2e;color:#102a43;font-family:Arial,sans-serif;padding:18px;box-sizing:border-box}.card{width:min(92vw,520px);background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0006}h2{margin:0 0 10px;color:#075fb0}.status{margin:14px 0;padding:12px;border-radius:12px;background:#eef6ff;font-weight:800;white-space:pre-wrap}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#075fb0;color:#fff;font-weight:900;font-size:15px}small{display:block;margin-top:12px;color:#52606d;line-height:1.4}</style></head><body><main class="card"><h2>ĐANG CẬP NHẬT E-REPORT</h2><p>Repair đang xóa service worker/cache của các bản phát hành cũ. Dữ liệu chuyến bay, nháp biểu mẫu, localStorage nghiệp vụ và IndexedDB không bị xóa.</p><div id="status" class="status">Đang chuẩn bị…</div><button id="retry" type="button" hidden>THỬ LẠI</button><small>Ứng dụng chỉ mở lại khi version, manifest và index cùng xác nhận đúng một build.</small></main><script>(async()=>{const s=document.getElementById('status'),btn=document.getElementById('retry'),q=new URLSearchParams(location.search),stage=q.get('stage')||'1',target=String(q.get('target')||'').trim();function indexMeta(h){try{const d=new DOMParser().parseFromString(String(h||''),'text/html');return{build:String(d.querySelector('meta[name="sags-release-build"]')?.getAttribute('content')||'').trim(),version:String(d.querySelector('meta[name="sags-release-version"]')?.getAttribute('content')||'').trim()}}catch(_){return{build:'',version:''}}}async function contract(expected=''){const t=Date.now(),o={cache:'no-store',headers:{'Cache-Control':'no-cache',Pragma:'no-cache'}},[vr,mr,ir]=await Promise.all([fetch('./version.json?__sags_strict=1&t='+t,o),fetch('./asset-manifest.json?__sags_strict=1&t='+t,o),fetch('./index.html?__repair=1&t='+t,o)]);if(!vr.ok||!mr.ok||!ir.ok)throw Error('Máy chủ chưa sẵn sàng ('+vr.status+'/'+mr.status+'/'+ir.status+')');const[v,m,h]=await Promise.all([vr.json(),mr.json(),ir.text()]),b=String(v?.build||'').trim(),dv=String(v?.displayVersion||v?.version||'').trim(),im=indexMeta(h);if(!b||!dv||String(m?.build||'').trim()!==b||String(m?.version||'').trim()!==dv||im.build!==b||im.version!==dv)throw Error('Bản phát hành trên máy chủ chưa đồng bộ đủ. Repair sẽ không mở nhầm bản cũ.');for(const k of['./index.html','./service-worker.js','./repair.html','./app/boot/05-legacy.js','./app/generated/boot-group-4.js']){const a=m?.assets?.[k];if(!a?.sha256||!Number.isSafeInteger(Number(a.bytes)))throw Error('Manifest bản mới chưa hoàn chỉnh: '+k)}if(expected&&b!==expected)throw Error('Bản cập nhật đã đổi từ '+expected+' sang '+b+'. Bấm THỬ LẠI để lấy bản mới nhất.');return b}const run=async()=>{btn.hidden=true;btn.disabled=true;try{const expected=await contract(target);s.textContent='Bản xác nhận: '+expected+'\n'+(stage==='1'?'Đang xóa service worker và cache bản cũ…':'Đang xác minh lần cuối trước khi mở ứng dụng…');try{localStorage.setItem('pdh-update-applying',expected);localStorage.setItem('sags-v6-deferred-build',expected);localStorage.setItem('sags-repair-target',expected)}catch(_){}if(stage==='1'){if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations(),here=new URL('./',location.href);await Promise.all(regs.filter(r=>{try{const u=new URL(r.scope);return u.origin===here.origin&&u.pathname===here.pathname}catch(_){return false}}).map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(n=>n.startsWith('sags-app-shell-')||n.startsWith('sags-app-meta-')).map(n=>caches.delete(n)))}const u=new URL('./repair.html',location.href);u.searchParams.set('stage','2');u.searchParams.set('auto','1');u.searchParams.set('target',expected);u.searchParams.set('_',Date.now());location.replace(u.href);return}const confirmed=await contract(expected);try{localStorage.setItem('sags-repair-ready',confirmed)}catch(_){}s.textContent='Đã xóa bản cũ và xác minh '+confirmed+'.\nĐang mở đúng phiên bản mới…';const u=new URL('./index.html',location.href);u.searchParams.set('__sags_release',confirmed);u.searchParams.set('_fresh',Date.now());u.searchParams.set('_expected',confirmed);setTimeout(()=>location.replace(u.href),180)}catch(e){s.textContent='Chưa thể hoàn tất cập nhật:\n'+String(e?.message||e)+'\n\nKhông chuyển sang bản khác để tránh vòng lặp.';btn.hidden=false;btn.disabled=false}};btn.onclick=run;run()})();</script></body></html>
