<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đang cập nhật E-REPORT</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#071a2e;color:#102a43;font-family:Arial,sans-serif;padding:18px;box-sizing:border-box}.card{width:min(92vw,560px);background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0006}h2{margin:0 0 10px;color:#075fb0}.status{margin:14px 0;padding:12px;border-radius:12px;background:#eef6ff;font-weight:800;white-space:pre-wrap;line-height:1.45}.diag{margin:10px 0;padding:10px;border-radius:10px;background:#f7fafc;color:#415466;font:12px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#075fb0;color:#fff;font-weight:900;font-size:15px;margin-top:8px}button.secondary{background:#e8f1f8;color:#174a6d;border:1px solid #b9d2e4}small{display:block;margin-top:12px;color:#52606d;line-height:1.4}</style></head><body><main class="card"><h2>ĐANG CẬP NHẬT E-REPORT</h2><p>Trang này gỡ service worker/cache của bản cũ nhưng <b>không xóa</b> dữ liệu chuyến bay, nháp biểu mẫu, localStorage nghiệp vụ hoặc IndexedDB.</p><div id="status" class="status">Đang chuẩn bị…</div><div id="diag" class="diag"></div><button id="retry" type="button" hidden>THỬ LẠI</button><button id="cleanTab" class="secondary" type="button" hidden>MỞ TAB SẠCH ĐỂ HOÀN TẤT</button><small>Ứng dụng chỉ mở lại sau khi tab đã tách khỏi service worker cũ và version, manifest, index cùng xác nhận đúng một build.</small></main><script>(async()=>{const s=document.getElementById('status'),diag=document.getElementById('diag'),btn=document.getElementById('retry'),clean=document.getElementById('cleanTab'),q=new URLSearchParams(location.search),stage=q.get('stage')||'1',detach=Number(q.get('detach')||0);const sleep=ms=>new Promise(r=>setTimeout(r,ms));function controllerLabel(){const c=navigator.serviceWorker?.controller;return c?String(c.scriptURL||'service-worker đang điều khiển'):'KHÔNG CÒN controller cũ'}function showDiag(extra=''){diag.textContent='Origin: '+location.origin+'\nController: '+controllerLabel()+(extra?'\n'+extra:'')}function indexMeta(h){try{const d=new DOMParser().parseFromString(String(h||''),'text/html');return{build:String(d.querySelector('meta[name="sags-release-build"]')?.getAttribute('content')||'').trim(),version:String(d.querySelector('meta[name="sags-release-version"]')?.getAttribute('content')||'').trim()}}catch(_){return{build:'',version:''}}}async function clearOldShell(){s.textContent='Đang gỡ service worker và cache bản cũ…';if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations(),here=new URL('./',location.href);await Promise.all(regs.filter(r=>{try{const u=new URL(r.scope);return u.origin===here.origin&&u.pathname===here.pathname}catch(_){return false}}).map(r=>r.unregister().catch(()=>false)))}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(n=>n.startsWith('sags-app-shell-')||n.startsWith('sags-app-meta-')).map(n=>caches.delete(n)))}showDiag()}async function contract(){let last='';for(let attempt=1;attempt<=10;attempt++){const t=Date.now()+'-'+attempt,o={cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate',Pragma:'no-cache'}},[vr,mr,ir]=await Promise.all([fetch('./version.json?__sags_strict=1&t='+t,o),fetch('./asset-manifest.json?__sags_strict=1&t='+t,o),fetch('./index.html?__repair=1&t='+t,o)]);if(vr.ok&&mr.ok&&ir.ok){const[v,m,h]=await Promise.all([vr.json(),mr.json(),ir.text()]),b=String(v?.build||'').trim(),dv=String(v?.displayVersion||v?.version||'').trim(),im=indexMeta(h);showDiag('Server version: '+dv+'\nServer build: '+b+'\nIndex version: '+im.version);if(b&&dv&&String(m?.build||'').trim()===b&&String(m?.version||'').trim()===dv&&im.build===b&&im.version===dv){for(const k of['./index.html','./service-worker.js','./repair.html','./app/boot/05-legacy.js','./app/generated/boot-group-4.js']){const a=m?.assets?.[k];if(!a?.sha256||!Number.isSafeInteger(Number(a.bytes)))throw Error('Manifest bản mới chưa hoàn chỉnh: '+k)}return{build:b,version:dv}}last='version='+b+', manifest='+String(m?.build||'').trim()+', index='+im.build}else last='HTTP '+vr.status+'/'+mr.status+'/'+ir.status;if(attempt<10){s.textContent='Đang chờ máy chủ đồng bộ bản mới… '+attempt+'/10';await sleep(700)}}throw Error('Bản phát hành trên máy chủ chưa đồng bộ đủ. '+last)}async function detachOldController(){if(!('serviceWorker'in navigator)||!navigator.serviceWorker.controller)return true;await clearOldShell();s.textContent='Service worker cũ vẫn đang giữ tab này. Đang tách tab khỏi bản cũ…';showDiag('Lần tách: '+(detach+1));if(detach>=4){clean.hidden=false;clean.disabled=false;return false}const u=new URL('./repair.html',location.href);u.searchParams.set('stage','2');u.searchParams.set('detach',String(detach+1));u.searchParams.set('_',String(Date.now()));await sleep(260);location.replace(u.href);return false}const run=async()=>{btn.hidden=true;btn.disabled=true;clean.hidden=true;clean.disabled=true;try{showDiag();if(stage==='1'){await clearOldShell();const u=new URL('./repair.html',location.href);u.searchParams.set('stage','2');u.searchParams.set('detach','0');u.searchParams.set('_',Date.now());location.replace(u.href);return}if(!await detachOldController())return;await clearOldShell();if(navigator.serviceWorker?.controller){if(!await detachOldController())return}const confirmed=await contract();try{localStorage.setItem('pdh-update-applying',confirmed.build);localStorage.setItem('sags-v6-deferred-build',confirmed.build);localStorage.setItem('sags-repair-target',confirmed.build);localStorage.setItem('sags-repair-ready',confirmed.build)}catch(_){}s.textContent='Đã tách bản cũ và xác minh '+confirmed.version+'.\nĐang mở phiên bản mới…';showDiag('Đã xác minh build: '+confirmed.build);const u=new URL('./',location.href);u.searchParams.set('__sags_release',confirmed.build);u.searchParams.set('_fresh',Date.now());u.searchParams.set('_expected',confirmed.build);setTimeout(()=>location.replace(u.href),260)}catch(e){s.textContent='Chưa thể hoàn tất cập nhật:\n'+String(e?.message||e)+'\n\nBấm THỬ LẠI để kiểm tra lại.';showDiag();btn.hidden=false;btn.disabled=false}};btn.onclick=run;clean.onclick=()=>{const u=new URL('./repair.html',location.href);u.searchParams.set('stage','2');u.searchParams.set('detach','0');u.searchParams.set('_',Date.now());const w=window.open(u.href,'_blank','noopener');if(!w)location.href=u.href};run()})();</script></body></html>
