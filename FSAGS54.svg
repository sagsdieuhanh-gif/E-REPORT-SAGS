<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1760" viewBox="0 0 1360 1760"><rect width="1360" height="1760" fill="white"/><rect x="94" y="50" width="92" height="92" rx="8" fill="#0b5c50"/><circle cx="140" cy="92" r="28" fill="#f0d21c"/><text x="140" y="148" font-family="Times New Roman,Arial" font-size="21" font-weight="700"  text-anchor="middle" fill="#174b63">SAGS</text><text x="205" y="104" font-family="Times New Roman,Arial" font-size="17" font-weight="400"  text-anchor="start" fill="#111">SAIGON GROUND SERVICES</text><text x="680" y="118" font-family="Times New Roman,Arial" font-size="34" font-weight="700"  text-anchor="middle" fill="#111">LOAD CONTROL CHECKLIST</text><text x="1000" y="68" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Page: 1/1</text><text x="1000" y="92" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Revision No.: 3</text><text x="1000" y="116" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Issuing date: 04Mar21</text><text x="1000" y="140" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Effective date: 07Mar21</text><text x="1000" y="164" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="start" fill="#111">Code: F/SAGS-CXR/54</text><line x1="100" y1="178" x2="1260" y2="178" stroke="#111" stroke-width="1.5"/><rect x="112" y="188" width="1136" height="64" fill="none" stroke="#111"/><line x1="405" y1="188" x2="405" y2="252" stroke="#111" stroke-width="1"/><line x1="560" y1="188" x2="560" y2="252" stroke="#111" stroke-width="1"/><line x1="790" y1="188" x2="790" y2="252" stroke="#111" stroke-width="1"/><text x="258" y="211" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="middle" fill="#111">Flight No. /Date</text><text x="482" y="211" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="middle" fill="#111">Sector</text><text x="675" y="211" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="middle" fill="#111">A/C Type</text><text x="1018" y="211" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="middle" fill="#111">A/C Registration</text><rect x="112" y="318" width="1136" height="30" fill="none" stroke="#111"/><text x="124" y="340" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">A. PRE-FLIGHT CHECK AND PREPARATION</text><rect x="112" y="348" width="1136" height="30" fill="none" stroke="#111"/><line x1="682" y1="348" x2="682" y2="378" stroke="#111" stroke-width="1"/><text x="397" y="370" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">Flight Information Check</text><text x="965" y="370" font-family="Times New Roman,Arial" font-size="18" font-weight="700"  text-anchor="middle" fill="#111">Preparation</text><rect x="112" y="378" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="378" x2="682" y2="410" stroke="#111" stroke-width="1"/><text x="150" y="400" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Flight no, sector, A/C Type/Reg, ETA/ETD, bay.</text><text x="700" y="400" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ General declaration</text><rect x="112" y="410" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="410" x2="682" y2="442" stroke="#111" stroke-width="1"/><text x="150" y="432" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Arrival messages, flight plan (if any)</text><text x="700" y="432" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ W&amp;B checklist</text><rect x="112" y="442" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="442" x2="682" y2="474" stroke="#111" stroke-width="1"/><text x="150" y="464" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ PNL/ ADL and PAX load</text><text x="700" y="464" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Fuel docket (if any)</text><rect x="112" y="474" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="474" x2="682" y2="506" stroke="#111" stroke-width="1"/><text x="150" y="496" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Cargo/Mail/EIC, special load/dangerous goods</text><text x="700" y="496" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Load/Trimsheet and LIR form (if any)</text><rect x="112" y="506" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="506" x2="682" y2="538" stroke="#111" stroke-width="1"/><text x="150" y="528" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Aircraft data (AHM, GOM, DOW/DOI, ...) (if any)</text><text x="700" y="528" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Working tools/Devices, PPE</text><rect x="112" y="538" width="1136" height="30" fill="none" stroke="#111"/><text x="124" y="560" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">B. LOAD PLANNING</text><rect x="112" y="568" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="568" x2="682" y2="600" stroke="#111" stroke-width="1"/><text x="150" y="590" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Distribute PAX in each cabin zone (if any)</text><text x="700" y="590" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Check trial trim within prescribed limits</text><rect x="112" y="600" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="600" x2="682" y2="632" stroke="#111" stroke-width="1"/><text x="150" y="622" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Estimate Bag/ULD (if any)</text><text x="700" y="622" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Remark special load/DG on LIR (if any)</text><rect x="112" y="632" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="632" x2="682" y2="664" stroke="#111" stroke-width="1"/><text x="150" y="654" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Select appropriate loading version/Distribution</text><text x="700" y="654" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Issue Loading Instruction Report (if any)</text><rect x="112" y="664" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="664" x2="682" y2="696" stroke="#111" stroke-width="1"/><text x="150" y="686" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Distribute deadload at positions on LIR</text><text x="700" y="686" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Brief LIR with Load master/Co-ordinator</text><rect x="112" y="696" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="696" x2="682" y2="728" stroke="#111" stroke-width="1"/><text x="150" y="718" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Input fuel figures (if any)</text><text x="700" y="718" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Sign on LIR and deliver LIR to Load Master/Co-ordinator</text><rect x="112" y="728" width="1136" height="30" fill="none" stroke="#111"/><text x="124" y="750" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">C. FLIGHT MONITORING</text><rect x="112" y="758" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="758" x2="682" y2="790" stroke="#111" stroke-width="1"/><text x="150" y="780" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Monitor PAX distribution on system</text><text x="700" y="780" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Verify actual Cargo/Mail/EIC load</text><rect x="112" y="790" width="1136" height="32" fill="none" stroke="#111"/><line x1="682" y1="790" x2="682" y2="822" stroke="#111" stroke-width="1"/><text x="150" y="812" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Monitor baggage quantity (pc/wgt; ULDs)</text><text x="700" y="812" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Check under load before LMC (if any)</text><rect x="112" y="822" width="1136" height="30" fill="none" stroke="#111"/><text x="124" y="844" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">D. LOADSHEET/TRIMSHEET COMPLETION</text><rect x="112" y="852" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="874" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Check aircraft actual trim within the prescribed limits (if any)</text><rect x="112" y="884" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="906" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Match CGO weight/ULD (Transit/Joining) against the Final Cargo Load</text><rect x="112" y="916" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="938" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Confirm closed out figures with Check-in Supervisor via walkie-talkie / OTT / system</text><rect x="112" y="948" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="970" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Verify Actual Baggage with Bag Handling Section via walkie-talkie / BMS</text><rect x="112" y="980" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1002" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Confirm actual loading/loading report with Load master/Co-ordinator then complete Load/Trim sheet</text><rect x="112" y="1012" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1034" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Crosscheck LIR with Load master/Co-ordinator and confirm PAX figures with Coordinator at aircraft side</text><rect x="112" y="1044" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1066" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Present/Transmit load/Trim sheet/LIR to Captain for inspection/signature (if any)</text><rect x="112" y="1076" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1098" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Adjust last minute change (if any) and hand over flight docs to Purser/Captain/Rep (if any)</text><rect x="112" y="1108" width="1136" height="30" fill="none" stroke="#111"/><text x="124" y="1130" font-family="Times New Roman,Arial" font-size="19" font-weight="700"  text-anchor="start" fill="#111">E. POST FLIGHT</text><rect x="112" y="1138" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1160" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Verify all special information on LIR and compose LDP messages (if any)</text><rect x="112" y="1170" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1192" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Send departure messages and release/finalize flight to downline stations (if any)</text><rect x="112" y="1202" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1224" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Distribute flight docs to all concerned Depts./Section, save files and upload data to FDS</text><rect x="112" y="1234" width="1136" height="32" fill="none" stroke="#111"/><text x="130" y="1256" font-family="Times New Roman,Arial" font-size="16" font-weight="400"  text-anchor="start" fill="#111">☐ Input final figures of BAG/CGO/MAIL in SMIS (output statistic) &amp; clean working area</text><rect x="112" y="1266" width="1136" height="35" fill="none" stroke="#111"/><text x="124" y="1290" font-family="Times New Roman,Arial" font-size="17" font-weight="400"  text-anchor="start" fill="#111">Remarks:    √ : Conformity     X : Non conformity     NA : Not Applicable</text><rect x="112" y="1301" width="1136" height="210" fill="none" stroke="#111"/><line x1="682" y1="1301" x2="682" y2="1511" stroke="#111" stroke-width="1"/><text x="390" y="1329" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="middle" fill="#111">Load Planner</text><text x="390" y="1355" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="middle" fill="#111">Signature</text><text x="965" y="1329" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="middle" fill="#111">Supervisor/Load Planner 2</text><text x="965" y="1355" font-family="Times New Roman,Arial" font-size="18" font-weight="400"  text-anchor="middle" fill="#111">Signature</text><text x="130" y="1491" font-family="Times New Roman,Arial" font-size="17" font-weight="400"  text-anchor="start" fill="#111">Name:........................................</text><text x="802" y="1491" font-family="Times New Roman,Arial" font-size="17" font-weight="400"  text-anchor="start" fill="#111">Name:........................................</text><line x1="180" y1="1521" x2="1180" y2="1521" stroke="#111" stroke-width="1"/><text x="680" y="1551" font-family="Times New Roman,Arial" font-size="16" font-weight="400" font-style="italic" text-anchor="middle" fill="#111">Verify that this is the correct version before use</text></svg>
