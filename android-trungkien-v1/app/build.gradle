plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sags.trungkien'
    compileSdk 35

    defaultConfig {
        applicationId "vn.sags.trungkien"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SHELL_NAME", "\"TrungKiên V1\""
        buildConfigField "String", "SHELL_VERSION", "\"V1\""
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("TRUNGKIEN_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("TRUNGKIEN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TRUNGKIEN_KEY_ALIAS")
                keyPassword System.getenv("TRUNGKIEN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
