plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sags.cxr.ereport'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.sags.cxr.ereport'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.5.47-apk-test1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
